---
- name: Uninstall Software
  become: true
  ansible.builtin.apt:
    name: "{{ item }}"
    state: absent
    purge: true
  loop: "{{ uninstall_software_packages }}"
  when:
    - uninstall_software_packages is defined
    - ansible_facts['distribution'] == "Ubuntu" or ansible_facts['distribution'] == "Debian"

- name: Uninstall Software (RedHat)
  become: true
  ansible.builtin.dnf:
    name: "{{ uninstall_software_packages }}"
    state: absent
  when:
    - uninstall_software_packages is defined
    - ansible_facts['os_family'] == "RedHat"

- name: Update Repositories
  become: true
  ansible.builtin.apt:
    update_cache: true
  when:
    - ansible_facts['distribution'] == "Ubuntu" or ansible_facts['distribution'] == "Debian"

- name: Upgrade Software
  become: true
  ansible.builtin.apt:
    upgrade: true
  when:
    - ansible_facts['distribution'] == "Ubuntu" or ansible_facts['distribution'] == "Debian"

- name: Install Base Packages
  become: true
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop: "{{ software_packages }}"
  when:
    - ansible_facts['distribution'] == "Ubuntu" or ansible_facts['distribution'] == "Debian"

- name: Install Custom Packages
  become: true
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop: "{{ custom_software_packages }}"
  when:
    - custom_software_packages is defined
    - ansible_facts['distribution'] == "Ubuntu" or ansible_facts['distribution'] == "Debian"
...
