---
- name: Install Software
  ansible.builtin.import_tasks: install_software.yml
  tags: install
  when:
    - install_software

- name: Install OTEL
  ansible.builtin.import_tasks: install_otel.yml
  tags: otel

- name: Setup OTEL
  ansible.builtin.import_tasks: setup_otel.yml
  tags: otel

- name: Setup SSH
  ansible.builtin.import_tasks: setup_ssh.yml
  tags: ssh
  when:
    - setup_ssh

- name: Setup fail2ban
  ansible.builtin.import_tasks: setup_fail2ban.yml
  tags: fail2ban
  when:
    - setup_fail2ban

- name: Setup NTP
  ansible.builtin.import_tasks: setup_ntp.yml
  tags: ntp
  when:
    - setup_ntp

- name: Setup bird
  ansible.builtin.import_tasks: setup_bird.yml
  tags: bird
  when:
    - setup_bird
...
