---
- name: Copy OTEL Splunk HEC CA certificate
  become: true
  ansible.builtin.copy:
    content: "{{ splunk_hec_ca_cert }}"
    dest: /etc/otelcol-contrib/splunk-hec-ca.pem
    owner: root
    group: root
    mode: '0644'
  when: splunk_hec_ca_cert is defined
  notify:
    - Restart OTEL Service

- name: Generate OTEL basic config
  become: true
  ansible.builtin.template:
    src: otel-base.j2
    dest: /etc/otelcol-contrib/config.yaml
    owner: root
    group: otelcol-contrib
    mode: '0640'
    validate: /usr/bin/otelcol-contrib validate --config=%s
  notify:
    - Restart OTEL Service
...
