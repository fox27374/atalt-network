---
ansible_python_interpreter: /usr/bin/python3

ssh_users:
- ansible
- dkofler

firewalld_services:
- ssh

custom_firewalld_services:
- 9080/tcp

software_packages:
- vim
- fail2ban

uninstall_software_packages:
- otelcol
- ufw
- syslog-ng

otel_version: 0.142.0

ntp_servers:
- 0.debian.pool.ntp.org
- 1.debian.pool.ntp.org
- 2.debian.pool.ntp.org
- 3.debian.pool.ntp.org

splunk_hec_url: https://hec.lnxnet.org/services/collector
# Defined in group_vars/all/vault.yml (ansible-vault encrypted)
splunk_hec_token: "{{ vault_splunk_hec_token }}"
# HEC route currently has a self-signed cert; set splunk_hec_ca_cert (PEM content) to enable verification
splunk_hec_insecure_skip_verify: true

wireguard: true

wireguard_role: client
...
